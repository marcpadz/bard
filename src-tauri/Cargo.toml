[package]
name = "bard"
version = "0.1.0"
description = "A tiny menu bar prompt enricher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
